[main]
leftalt = layer(cmd)
rightalt = layer(cmd)
leftmeta = layer(opt)
rightmeta = layer(opt)
f4 = A-space

# Cmd: anything not listed below becomes Ctrl+key (Cmd+C/V/X/Z/A/S/F/T/W/Q/N...)
[cmd:C]
tab = swapm(app_switch, A-tab)
grave = swapm(app_switch, A-grave)
space = A-space
c = C-insert
v = S-insert
x = S-delete
h = M-pagedown
m = M-pagedown
left = home
right = end
up = C-home
down = C-end
backspace = macro(S-home backspace)
[ = A-left
] = A-right
1 = A-1
2 = A-2
3 = A-3
4 = A-4
5 = A-5
6 = A-6
7 = A-7
8 = A-8
9 = A-9

# Held Cmd+Tab keeps Alt down so the switcher stays open
[app_switch:A]

# Option: word-wise movement/deletion, otherwise plain Alt
[opt:A]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[opt+shift]
left = C-S-left
right = C-S-right

[cmd+shift]
left = S-home
right = S-end
up = C-S-home
down = C-S-end
3 = S-print
4 = M-S-print
5 = print
[ = C-pageup
] = C-pagedown

[cmd+control]
q = M-l
g = toggle(gaming)

[cmd+opt]
esc = C-M-esc

# Ctrl+Up = Mission Control (Overview), Ctrl+Left/Right = switch desktop
[control]
up = M-w
left = C-M-left
right = C-M-right

# Game mode (Cmd+Ctrl+G to enter): stock PC keys. Ctrl+Alt+G to leave.
[gctrl:C]

[gaming]
leftalt = layer(alt)
rightalt = layer(alt)
leftmeta = layer(meta)
rightmeta = layer(meta)
leftcontrol = layer(gctrl)
rightcontrol = layer(gctrl)
f4 = f4

[gctrl+alt]
g = toggle(gaming)
